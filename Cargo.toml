# [package]
# authors = [""]
# # build = "build.rs"
# description = "Open source Firecracker accelerator for high-speed forwarding & resource-efficient network"
# edition = "2024"
# homepage = "https://github.com/fahren-stack/fahren"
# license = "Apache-2.0 AND BSD-3-Clause"
# name = "fahren"

[workspace]
members = [
  "net_gen",
  "net_util",
  "option_parser",
  "rate_limiter",
  "vhost_user_net",
  "vm_virtio",
]
package.edition = "2024"

[workspace.dependencies]
# rust-vmm crates
acpi_tables = { git = "https://github.com/rust-vmm/acpi_tables", branch = "main" }
kvm-bindings = "0.12.1"
kvm-ioctls = "0.22.1"
linux-loader = "0.13.1"
mshv-bindings = "0.6.0"
mshv-ioctls = "0.6.0"
seccompiler = "0.5.0"
vfio-bindings = { version = "0.6.0", default-features = false }
vfio-ioctls = { version = "0.5.1", default-features = false }
vfio_user = { version = "0.1.1", default-features = false }
vhost = { version = "0.14.0", default-features = false }
vhost-user-backend = { version = "0.20.0", default-features = false }
virtio-bindings = "0.2.6"
virtio-queue = "0.16.0"
vm-fdt = "0.3.0"
vm-memory = "0.16.1"
vmm-sys-util = "0.14.0"

# igvm crates
# TODO: bump to 0.3.5 release
igvm = { git = "https://github.com/microsoft/igvm", branch = "main" }
igvm_defs = { git = "https://github.com/microsoft/igvm", branch = "main" }

# serde crates
serde = "1.0.228"
serde_json = "1.0.145"
serde_with = { version = "3.15.0", default-features = false }

# other crates
anyhow = "1.0.99"
bitflags = "2.9.4"
byteorder = "1.5.0"
cfg-if = "1.0.3"
clap = "4.5.49"
dhat = "0.3.3"
dirs = "6.0.0"
env_logger = "0.11.8"
epoll = "4.4.0"
flume = "0.11.1"
libc = "0.2.177"
log = "0.4.28"
signal-hook = "0.3.18"
thiserror = "2.0.17"
uuid = { version = "1.18.1" }
wait-timeout = "0.2.1"
zerocopy = { version = "0.8.27", default-features = false }
